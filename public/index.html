<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ef">
  <title>Unit 6 Handswatter · Swat It!</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18231f;background:#f5f4ef;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 0,#fff9e7 0,#f5f4ef 55%)}
    button,input{font:inherit}button{cursor:pointer}.shell{width:min(1120px,100%);margin:auto;padding:28px 18px 52px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:13px}.brand-mark{display:grid;place-items:center;width:48px;height:48px;border-radius:16px;background:#cfed71;font-size:1.55rem;box-shadow:0 7px 20px #52641d20}.eyebrow{margin:0 0 5px;color:#66765c;font-size:.72rem;letter-spacing:.15em;font-weight:850;text-transform:uppercase}h1{margin:0;font-size:clamp(1.8rem,5vw,2.5rem);letter-spacing:-.06em;line-height:1}h2{margin:.2rem 0 .7rem;font-size:clamp(1.4rem,4vw,2rem);letter-spacing:-.045em}.status{font-size:.84rem;color:#68746c;font-weight:700}.status.connected{color:#228552}.status.reconnecting{color:#ab7100}.status.offline{color:#b54040}.card{background:#fff;border:1px solid #e5e5dc;border-radius:23px;padding:clamp(18px,4vw,28px);box-shadow:0 12px 36px #252b1810;margin-bottom:16px}.intro{max-width:700px;color:#53635b;line-height:1.6}.row{display:flex;gap:11px;flex-wrap:wrap;align-items:center}.button{border:0;border-radius:13px;padding:13px 18px;background:#27392f;color:#fff;font-weight:800;transition:transform .14s,filter .14s}.button:hover{filter:brightness(1.09);transform:translateY(-1px)}.button.secondary{background:#e9ede4;color:#27392f}.button[disabled]{opacity:.5;cursor:not-allowed;transform:none}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:.88rem;font-weight:800}.field input{width:100%;max-width:520px;border:1px solid #ccd4ca;background:#fbfcfa;border-radius:12px;padding:13px 14px;color:#18231f}.field input:focus,button:focus-visible{outline:3px solid #96b83d;outline-offset:2px}.muted{color:#758078}.notice{padding:13px 15px;border-radius:14px;background:#f4f6ed;line-height:1.5}.roomline{display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:#526057}.roomcode{display:inline-block;padding:7px 11px;border:1px solid #dfe4d7;border-radius:9px;background:#f8f9f4;font-size:1rem;font-weight:900;letter-spacing:.1em}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile{display:grid;place-items:center;min-height:115px;padding:15px;border:2px solid #dde2d7;border-radius:18px;background:#fff;color:#18231f;font-size:clamp(1rem,2.7vw,1.3rem);font-weight:850;text-align:center;box-shadow:0 3px 8px #14201808}.tile:hover:not(:disabled),.tile:focus-visible{border-color:#98b63c;background:#fbffef}.tile:disabled{cursor:default;opacity:.8}.tile.correct{background:#e4f7dc;border-color:#2a9a56}.tile.wrong{background:#fff0e9;border-color:#d65c45}.score-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}.metric{padding:16px;border-radius:16px;background:#f5f7f0}.metric strong{display:block;font-size:2rem;letter-spacing:-.05em}.metric span{color:#657168;font-size:.84rem}.leaderboard{margin:0;padding:0;list-style:none;display:grid;gap:7px}.leaderboard li{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid #eceee7;border-radius:12px;background:#fcfcfa}.rank{font-weight:900;color:#77843d}.student-name{font-weight:780;overflow-wrap:anywhere}.points{font-weight:900;white-space:nowrap}.empty{padding:14px;border-radius:12px;background:#f6f7f2;color:#768078}.twocol{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}.tiny{font-size:.8rem;line-height:1.5;color:#788179}.hide{display:none!important}.boardmode{background:#141b18;color:#f6f9f3}.boardmode .shell{max-width:1500px}.boardmode .topbar{margin-bottom:12px}.boardmode .brand-mark{background:#d0f078}.boardmode .status{color:#cad5c5}.boardmode .eyebrow{color:#d2ed8f}.boardmode .card{background:#1f2a24;border-color:#354139;color:#f2f5f0}.boardmode .intro,.boardmode .muted,.boardmode .tiny{color:#b7c3b8}.boardmode .leaderboard li{background:#27342c;border-color:#3b493f}.boardmode .student-name{color:#fff}.boardmode .points{color:#d2ed8f}.boardmode .rank{color:#d2ed8f}.boardmode .tile{min-height:clamp(115px,20vh,215px);font-size:clamp(1.5rem,4vw,3rem);background:#f9fbf5;border-color:#dce6d4}.boardmode .roomcode{background:#27342c;color:#fff;border-color:#465448}.boardmode .notice{background:#293a2b;color:#eef4e6}.boardmode .metric{background:#27342c}.boardmode .metric span{color:#b7c3b8}.boardmode .empty{background:#27342c;color:#b7c3b8}
    @media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.twocol,.score-layout{grid-template-columns:1fr}.topbar{align-items:flex-start}}
    @media(max-width:420px){.grid{gap:8px}.tile{min-height:100px;padding:10px}.shell{padding-inline:12px}.brand-mark{width:40px;height:40px}}
  </style>
</head>
<body>
<div class="shell">
  <header class="topbar"><div class="brand"><div class="brand-mark" aria-hidden="true">✋</div><div><p class="eyebrow">Unit 6 review</p><h1>Swat It!</h1></div></div><div id="status" class="status">Ready</div></header>
  <main id="app"></main>
</div>
<script>
(() => {
  const app=document.querySelector('#app'),status=document.querySelector('#status');
  const params=new URLSearchParams(location.search);const queryRoom=(params.get('room')||'').toUpperCase();
  const KEY='unit6-swat-session';let session=null;try{session=JSON.parse(localStorage.getItem(KEY)||'null')}catch{}
  let ws=null,retry=0,timer=null,state=null,view=params.get('view')||'';
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const setStatus=(s,kind='')=>{status.textContent=s;status.className='status '+kind};
  const save=()=>localStorage.setItem(KEY,JSON.stringify(session));
  function connect(){clearTimeout(timer);if(!session?.room)return;setStatus(retry?'Reconnecting…':'Connecting…',retry?'reconnecting':'');const scheme=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(scheme+'://'+location.host+'/room/'+encodeURIComponent(session.room));ws.onopen=()=>{retry=0;setStatus('Connected','connected');ws.send(JSON.stringify({type:'hello',role:session.role,id:session.id,name:session.name,teacherToken:session.teacherToken}))};ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.error){setStatus(m.error,'offline');return}state=m;render()}catch{}};ws.onclose=()=>{setStatus('Reconnecting…','reconnecting');retry=Math.min(retry+1,7);timer=setTimeout(connect,Math.min(800*2**retry,12000))};ws.onerror=()=>{try{ws.close()}catch{}}}
  function send(message){if(ws?.readyState===1)ws.send(JSON.stringify(message))}
  function resetSession(){localStorage.removeItem(KEY);location.href=location.pathname}
  function topTen(){const list=state?.public?.leaderboard||[];if(!list.length)return '<div class="empty">No student scores yet. Scores will appear here after the first correct answer.</div>';return '<ol class="leaderboard">'+list.map(x=>'<li><span class="rank">#'+x.rank+'</span><span class="student-name">'+esc(x.name)+'</span><span class="points">'+x.score+' pt'+(x.score===1?'':'s')+'</span></li>').join('')+'</ol>'}
  function headerRoom(){return '<div class="roomline"><span>Room code</span><span class="roomcode">'+esc(session.room)+'</span></div>'}
  function showHome(){app.innerHTML='<section class="card"><p class="eyebrow">Live classroom game</p><h2>Practice the Unit 6 vocabulary</h2><p class="intro">The teacher creates one room. Every student joins individually, signs in with their own name, and earns their own points. Each correct swat earns one point.</p><div class="row"><button class="button" id="teacher">Create teacher room</button><button class="button secondary" id="student">Join as student</button><button class="button secondary" id="projector">Open projector board</button></div></section><section class="card"><h2>How the leaderboard protects students</h2><p class="intro">The main board displays only the top 10 students. Each student’s device privately shows that student’s own score and current rank, including ranks below 10.</p><p class="tiny">Rooms run through the Cloudflare server. Scores below the top 10 are not included in the public leaderboard data.</p></section>';
    document.querySelector('#teacher').onclick=teacherSetup;document.querySelector('#student').onclick=studentSetup;document.querySelector('#projector').onclick=()=>projectorSetup(queryRoom)}
  function teacherSetup(){app.innerHTML='<section class="card"><p class="eyebrow">Teacher setup</p><h2>Create a live room</h2><p class="intro">Students will join independently and keep individual scores.</p><button class="button" id="create">Create room</button></section>';document.querySelector('#create').onclick=()=>{const code=crypto.getRandomValues(new Uint8Array(4));const room=Array.from(code,x=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[x%32]).join('');session={room,role:'teacher',id:crypto.randomUUID(),name:'Teacher',teacherToken:crypto.randomUUID()};save();connect()}}
  function studentSetup(){app.innerHTML='<section class="card"><p class="eyebrow">Student join</p><h2>Join your class</h2><div class="field"><label for="room">Room code</label><input id="room" maxlength="6" autocapitalize="characters" value="'+esc(queryRoom)+'"></div><div class="field"><label for="name">Your name</label><input id="name" maxlength="40" autocomplete="given-name"></div><p class="tiny" id="roomHint">Enter your name and the teacher’s room code. Your score and rank are individual.</p><button class="button" id="join">Join game</button><p class="tiny">Your current rank is visible only on your device unless you are in the public top 10.</p></section>';const roomInput=document.querySelector('#room');const roomReady=async()=>{const code=roomInput.value.trim().toUpperCase();if(!code)return false;try{const response=await fetch('/room/'+encodeURIComponent(code)+'/info');if(!response.ok)return false;const info=await response.json();document.querySelector('#roomHint').textContent=info.ready?'Room found. Your personal score will be saved in this Cloudflare room.':'That room is not open yet. Ask the teacher for the room code after they create it.';return info.ready}catch{return false}};roomInput.addEventListener('blur',roomReady);if(queryRoom)roomReady();document.querySelector('#join').onclick=async()=>{const room=roomInput.value.trim().toUpperCase(),name=document.querySelector('#name').value.trim();if(!room||!name)return;if(!await roomReady()){document.querySelector('#roomHint').textContent='Room not found or not ready. Check the code with your teacher.';return}session={room,role:'student',id:crypto.randomUUID(),name};save();connect()}}
  function projectorSetup(room,persist=false){if(room){session={room,role:'board',id:crypto.randomUUID(),name:'Projector'};if(persist)save();connect();return}app.innerHTML='<section class="card"><p class="eyebrow">Projector</p><h2>Show the class board</h2><div class="field"><label for="room">Room code</label><input id="room" maxlength="6" autocapitalize="characters"></div><button class="button" id="open">Open board</button></section>';document.querySelector('#open').onclick=()=>{const code=document.querySelector('#room').value.trim().toUpperCase();if(code)projectorSetup(code,false)}}
  function render(){if(!state||!session)return;if(session.role==='teacher')renderTeacher();else if(session.role==='board')renderBoard();else renderStudent()}
  function tiles(disabled=false,answer=null){return '<div class="grid">'+(state.public.tiles||[]).map((word,i)=>{let cls='';if(answer?.tile===i)cls=answer.correct?'correct':'wrong';return '<button class="tile '+cls+'" data-tile="'+i+'" '+(disabled?'disabled':'')+'>'+esc(word)+'</button>'}).join('')+'</div>'}
  function renderTeacher(){const current=state.private||{};app.innerHTML='<section class="card">'+headerRoom()+'<p class="eyebrow">ROUND '+(state.public.round+1)+' · '+esc(state.public.category||'Ready')+'</p><h2>'+(state.public.phase==='active'?'Sign this word:':'Next word to sign:')+'</h2><div class="metric"><strong>'+esc(current.target||'Waiting for students')+'</strong><span>Show this sign to the class. Student devices do not receive the target.</span></div><div style="margin-top:16px">'+tiles(true)+'</div><div class="row" style="margin-top:16px"><button class="button" id="start" '+(!state.public.students?'disabled':'')+'>'+(state.public.phase==='active'?'Sign is live':'Start sign')+'</button><button class="button secondary" id="next">Next word</button><button class="button secondary" id="copyStudent">Copy student link</button><button class="button secondary" id="copyBoard">Copy projector link</button><button class="button secondary" id="reset">End room</button></div><p class="notice">'+(state.public.phase==='active'?'The sign is live. First correct student earns 1 individual point.':'Students joined: '+state.public.students+' · The main board lists only the top 10.')+'</p></section><section class="card"><h2>Top 10 students</h2>'+topTen()+'</section>';
    document.querySelector('#start').onclick=()=>send({type:'start'});document.querySelector('#next').onclick=()=>send({type:'next'});document.querySelector('#reset').onclick=()=>send({type:'reset'});document.querySelector('#copyStudent').onclick=()=>copyLink('student');document.querySelector('#copyBoard').onclick=()=>copyLink('board')}
  function renderStudent(){const me=state.me||{score:0,rank:state.public.students||0};const active=state.public.phase==='active';app.innerHTML='<section class="card">'+headerRoom()+'<p class="eyebrow">ROUND '+(state.public.round+1)+' · '+esc(state.public.category||'Waiting')+'</p><h2>Find the signed word</h2><p class="intro">Watch the teacher sign, then tap the matching word. Your score is individual.</p>'+tiles(!active||me.answer,me.answer)+'<p class="notice">'+(me.answer?(me.answer.correct?'Correct! You earned 1 point.':'That was not it. Your answer is locked for this word.'):(active?'Choose the matching tile.':'Wait for the teacher to start the sign.'))+'</p></section><div class="twocol"><section class="card"><h2>Your private score</h2><div class="score-layout"><div class="metric"><strong>'+me.score+'</strong><span>Your points</span></div><div class="metric"><strong>#'+me.rank+'</strong><span>Your current rank · only you see it here</span></div></div><p class="tiny">Your personal rank updates as scores change. Students below the top 10 are never listed on the main board.</p></section></div>';
    document.querySelectorAll('[data-tile]').forEach(b=>b.onclick=()=>send({type:'answer',tile:Number(b.dataset.tile)}))}
  function renderBoard(){document.body.classList.add('boardmode');app.innerHTML='<section class="card">'+headerRoom()+'<p class="eyebrow">UNIT 6 · ROUND '+(state.public.round+1)+' · '+esc(state.public.category||'Waiting for teacher')+'</p><h2>Watch the sign. Swat the matching word.</h2>'+tiles(true)+'<p class="notice">'+(state.public.phase==='active'?'The sign is live!':'Waiting for the teacher to start the next sign.')+'</p><button class="button secondary" id="full">Full screen</button></section><section class="card"><h2>Top 10 students</h2>'+topTen()+'</section>';document.querySelector('#full').onclick=()=>document.documentElement.requestFullscreen?.()}
  async function copyLink(kind){const url=new URL(location.href);url.search='';url.searchParams.set('room',session.room);url.searchParams.set('view',kind==='board'?'board':'student');try{await navigator.clipboard.writeText(url.href);setStatus((kind==='board'?'Projector':'Student')+' link copied','connected')}catch{prompt('Copy this link',url.href)}}
  function boot(){if(view==='board'&&queryRoom){projectorSetup(queryRoom,false);return}if(view==='student'&&queryRoom){studentSetup();return}if(session?.room&&session.role){connect();return}showHome()}
  boot();
})();
</script>
</body>
</html>
