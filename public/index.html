<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unit 6 Handswatter</title><style> *{box-sizing:border-box}body{margin:0;background:#f1f6f5;color:#173336;font:16px system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:2rem;margin:0}h2{margin:0 0 10px}section{background:white;padding:24px;border:1px solid #d5e7e3;border-radius:18px;margin:18px 0;box-shadow:0 8px 24px #163a320a}.row{display:flex;flex-wrap:wrap;gap:10px;margin:15px 0}button,.button{border:0;border-radius:9px;padding:12px 16px;background:#126a62;color:white;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:default}.secondary{background:#e4f2ef;color:#164a45}input{font:inherit;padding:12px;border:1px solid #aac6c1;border-radius:8px;width:100%;max-width:320px}label{display:block;font-weight:700;margin-top:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.tile{min-height:80px;background:#ecf7f5;color:#173b38;border:2px solid #cde6e1}.tile.chosen{background:#c9efda;border-color:#28a062}.notice{background:#f2f8ed;border-radius:8px;padding:12px}.leader{list-style:none;padding:0}.leader li{display:flex;gap:15px;padding:8px;border-bottom:1px solid #eee}.leader li span:last-child{margin-left:auto}.muted{color:#56716f}a{color:#126a62}.room{font-weight:800;letter-spacing:.1em}.error{color:#a22} @media(max-width:500px){main{padding:14px}.grid{grid-template-columns:repeat(2,1fr)}section{padding:16px}}</style></head><body><main><header><div><small>UNIT 6 REVIEW</small><h1>✋ Handswatter</h1></div><span id="status" class="muted"></span></header><div id="app"></div></main><script>
(()=>{const app=document.querySelector('#app'),status=document.querySelector('#status'),params=new URLSearchParams(location.search),key='unit6-fresh-session';let session=null,state=null,ws=null,retry;try{session=JSON.parse(localStorage.getItem(key))}catch{};const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(key,JSON.stringify(session));const cmd=x=>ws?.readyState===1&&ws.send(JSON.stringify(x));function connect(){clearTimeout(retry);status.textContent='Connecting…';ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/room/'+session.room);ws.onopen=()=>{status.textContent='Connected';cmd({type:'hello',role:session.role,id:session.id,name:session.name,token:session.token})};ws.onmessage=e=>{let v=JSON.parse(e.data);if(v.error){status.textContent=v.error;status.className='error';return}state=v;render()};ws.onclose=()=>{status.textContent='Reconnecting…';retry=setTimeout(connect,2000)}}
function home(){app.innerHTML='<section><h2>Play together, wherever you are</h2><p>The teacher signs a word. Students select the matching tile on their own device. Correct answers earn points by speed.</p><div class="row"><button id="create">Create teacher room</button><button id="join" class="secondary">Join as student</button><button id="board" class="secondary">Open projector</button></div></section><section><h2>Scoring</h2><p>First correct: 10 points; second: 9; third: 8, down to 2 for ninth. Everyone correct after ninth gets 1 point. Incorrect answers earn 0.</p></section>';document.querySelector('#create').onclick=()=>{const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',bytes=crypto.getRandomValues(new Uint8Array(6));session={room:Array.from(bytes,b=>chars[b%32]).join(''),role:'teacher',token:crypto.randomUUID()};save();connect()};document.querySelector('#join').onclick=()=>join('student');document.querySelector('#board').onclick=()=>join('board')}
function join(role){app.innerHTML='<section><h2>'+(role==='student'?'Join the game':'Open projector')+'</h2><label for="code">Room code</label><input id="code" maxlength="6" value="'+esc(params.get('room')||'')+'">'+(role==='student'?'<label for="name">Your name</label><input id="name" maxlength="40">':'')+'<div class="row"><button id="go">Join</button></div><p id="hint" class="error"></p></section>';document.querySelector('#go').onclick=async()=>{const room=document.querySelector('#code').value.trim().toUpperCase(),name=role==='student'?document.querySelector('#name').value.trim():'';if(!/^[A-HJ-NP-Z2-9]{6}$/.test(room)||role==='student'&&!name){document.querySelector('#hint').textContent='Enter a valid room code and name.';return}try{let r=await fetch('/room/'+room+'/info');if(!r.ok||!(await r.json()).ready)throw Error();session={room,role,name,id:crypto.randomUUID()};save();connect()}catch{document.querySelector('#hint').textContent='Room not found. Check with your teacher.'}}}
function leaderboard(){return state.leaderboard.length?'<ol class="leader">'+state.leaderboard.map(p=>'<li><strong>#'+p.rank+'</strong><span>'+esc(p.name)+'</span><span>'+p.score+' pts</span></li>').join('')+'</ol>':'<p class="muted">No students yet.</p>'}function tiles(type){return '<div class="grid">'+state.words.map((w,i)=>{let disabled=type==='student'?state.phase!=='active'||!!state.me?.answer:type==='teacher'?(state.phase==='active'||state.phase==='finished')||state.teacher.used.includes(i)||state.signCount>=8:true;return '<button class="tile '+(type==='student'&&state.me?.answer?.index===i?'chosen':'')+'" data-index="'+i+'" '+(disabled?'disabled':'')+'>'+esc(w)+'</button>'}).join('')+'</div>'}function render(){let top='<p class="room">ROOM '+esc(session.room)+'</p><p class="muted">Round '+state.round+' of '+state.total+' · '+esc(state.category)+' · '+state.signCount+' of up to 8 signs</p>';if(session.role==='teacher'){let t=state.teacher;app.innerHTML='<section>'+top+'<h2>Teacher controls</h2><p>Choose a word, sign it to the class, then close the sign when students have answered.</p>'+(state.phase==='active'?'<p class="notice"><strong>Sign: '+esc(state.words[t.target])+'</strong> · '+t.answered+' answered</p>':'<p class="notice">'+(state.phase==='finished'?'Game complete.':state.phase==='closed'?'Sign closed. Choose another word or finish the round.':'Choose a word to start.')+'</p>')+tiles('teacher')+'<div class="row"><button id="close" '+(state.phase!=='active'?'disabled':'')+'>Close sign</button><button class="secondary" id="next" '+(state.phase==='active'||state.phase==='finished'?'disabled':'')+'>Finish round / next slide</button><button class="secondary" id="studentLink">Copy student link</button><button class="secondary" id="boardLink">Copy projector link</button><button class="secondary" id="reset">Start over</button></div><p class="muted">'+state.studentCount+' students joined. Scores accumulate across all rounds.</p></section><section><h2>Top 10 · cumulative totals</h2>'+leaderboard()+'</section>';document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>cmd({type:'open',index:Number(b.dataset.index)}));document.querySelector('#close').onclick=()=>cmd({type:'close'});document.querySelector('#next').onclick=()=>cmd({type:'next'});document.querySelector('#reset').onclick=()=>{if(confirm('Start over and clear this room’s scores?'))cmd({type:'reset'})};for(const role of ['student','board'])document.querySelector('#'+role+'Link').onclick=async()=>{let u=new URL(location.href);u.search='';u.searchParams.set('room',session.room);u.searchParams.set('view',role);try{await navigator.clipboard.writeText(u.href);status.textContent='Link copied'}catch{prompt('Copy link:',u.href)}}}
else if(session.role==='student'){let m=state.me;app.innerHTML='<section>'+top+'<h2>Find the signed word</h2><p>Watch your teacher, then select one answer.</p>'+tiles('student')+'<p class="notice">'+(m?.answer?(m.answer.correct?'Correct! +'+m.answer.points+' points.':'Incorrect. No points for this sign.'):(state.phase==='active'?'Choose the matching word.':state.phase==='finished'?'Game complete.':'Wait for the teacher to start the next sign.'))+'</p></section><section><h2>Your score</h2><p><strong>'+m.score+' points · Rank #'+m.rank+'</strong></p><p class="muted">Your rank is private unless you are in the top 10.</p></section>' ;document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>cmd({type:'answer',index:Number(b.dataset.index)}))}
else app.innerHTML='<section>'+top+'<h2>Watch the sign. Choose your answer.</h2>'+tiles('board')+'<p class="notice">'+(state.phase==='active'?'Sign is live!':state.phase==='finished'?'Game complete.':'Waiting for the teacher.')+'</p></section><section><h2>Top 10 · cumulative totals</h2>'+leaderboard()+'</section>';}
if(params.get('view')&&params.get('room')){session=null;join(params.get('view')==='board'?'board':'student')}else if(session?.room)connect();else home()})();</script></body></html>
